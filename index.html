  <div class="desktop-scene">
    <aside class="desktop-intro" aria-hidden="true">
      <span class="intro-logo">⛑</span>
      <h1>Моя <em>вахта</em></h1>
      <p>Твои смены. Твои планы. Твои люди.</p>
      <span class="intro-line"></span>
      <p class="intro-foot">Планируйте вахты, сохраняйте важные даты и оставайтесь на связи</p>
    </aside>
    <div class="device-frame">
      <div class="device-screen">
        <header class="app-header">
          <div class="header-brand"><span class="brand-icon"><svg><use href="#i-helmet"/></svg></span><span class="brand-title">Моя <b>вахта</b></span></div>
          <div class="header-actions">
            <button class="icon-button" type="button" id="notificationButton" aria-label="Уведомления" data-action="open-notifications"><svg><use href="#i-bell"/></svg><span class="badge" id="notificationBadge" hidden></span></button>
            <button class="profile-avatar" type="button" data-nav="profile" aria-label="Мой профиль">М</button>
          </div>
        </header>
        <main id="appMain" class="app-content" tabindex="-1" aria-live="polite"><div class="loading">Загружаем «Мою вахту»…</div></main>
        <nav class="bottom-nav" id="bottomNav" aria-label="Основная навигация">
          <button type="button" data-nav="home"><svg><use href="#i-home"/></svg><span>Главная</span></button>
          <button type="button" data-nav="calendar"><svg><use href="#i-calendar"/></svg><span>Календарь</span></button>
          <button type="button" data-nav="finance"><svg><use href="#i-coins"/></svg><span>Финансы</span></button>
          <button type="button" data-nav="messages"><svg><use href="#i-chat"/></svg><span>Сообщения</span><i class="nav-count" id="messagesBadge" hidden></i></button>
          <button type="button" data-nav="friends"><svg><use href="#i-friends"/></svg><span>Друзья</span></button>
          <button type="button" data-nav="more"><svg><use href="#i-more"/></svg><span>Ещё</span></button>
        </nav>
      </div>
    </div>
    <aside class="desktop-side" aria-hidden="true"><span class="side-kicker">ПЕРВАЯ ВЕРСИЯ</span><h2>Всегда понятно,<br>когда домой.</h2><p>Работа и межвахта. Личный календарь. История выплат. Друзья и связь.</p><span class="side-offline">●&nbsp; Работает без сети</span></aside>
  </div>
  <dialog id="appDialog" class="app-dialog" aria-labelledby="dialogTitle"><form id="dialogForm" method="dialog"><div class="dialog-heading"><h2 id="dialogTitle">Настройка</h2><button type="button" class="dialog-close" data-action="close-dialog" aria-label="Закрыть">×</button></div><div id="dialogBody"></div><div id="dialogActions" class="dialog-actions"></div></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="importFile" type="file" accept=".json,application/json" hidden>

</html>
